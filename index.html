<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Whisper → Voice | iPhone</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1a202b;--line:#30394a;--text:#edf2fb;--muted:#9ba8ba;--accent:#83b5ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#202b3d 0,#10131a 58%);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:650px;margin:auto}
h1{font-size:32px;letter-spacing:-.04em;margin:12px 0 4px}
.sub,.muted{color:var(--muted)}
.panel{background:#1a202b;border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}
textarea,select{width:100%;background:#101722;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font:17px/1.5 inherit}
textarea{min-height:145px;resize:vertical}
select{font:16px -apple-system,BlinkMacSystemFont,sans-serif}
button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:14px 16px;cursor:pointer}
.primary{background:var(--accent);color:#081321}
.secondary{background:#30394a;color:var(--text)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button:disabled{opacity:.45}
.output{font-size:21px;min-height:45px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
@media(max-width:390px){h1{font-size:28px}.panel{padding:15px}}
</style>
</head>
<body>
<main>
  <span class="pill">iPhone / Safari 対応版</span>
  <h1>Whisper → Voice</h1>
  <p class="sub">小さな声を文字にして、別の声で読み上げる</p>

  <section class="panel">
    <strong>1. ささやきを文字にする</strong>
    <p class="note">入力欄をタップして、iPhoneキーボードのマイクボタンから音声入力してね</p>
    <textarea id="text" placeholder="ここに音声入力された文章が入るよ"></textarea>
    <div class="controls">
      <button class="secondary" id="clear">クリア</button>
      <button class="primary" id="speak">▶ 読み上げる</button>
    </div>
  </section>

  <section class="panel">
    <strong>2. 読み上げ設定</strong>
    <label for="lang">読み上げ言語</label>
    <select id="lang"><option value="ja-JP">日本語</option><option value="en-US">English</option></select>
    <label for="voice">声</label>
    <select id="voice"><option value="">システム標準</option></select>
    <label for="rate">速度：<span id="rateVal">1.0</span></label>
    <input id="rate" type="range" min=".7" max="1.5" step=".1" value="1">
    <div class="controls">
      <button class="secondary" id="stop">■ 停止</button>
      <button class="secondary" id="test">テスト再生</button>
    </div>
    <label>読み上げた文章</label>
    <div class="output" id="output">---</div>
  </section>

  <p class="note">iPhoneでは、Webページからキーボードの音声入力を自動で開始したり、入力のたびに自動読み上げしたりすることはできないため、この版は「音声入力 → 読み上げ」方式だよ。音声入力と読み上げはiPhone側の機能を使い、音声データをこのページ独自のサーバーへ送信しない設計だよ。</p>
</main>
<script>
(() => {
 const $=id=>document.getElementById(id);
 let voices=[];
 function loadVoices(){
   voices=speechSynthesis.getVoices();
   const select=$('voice'), old=select.value;
   select.innerHTML='<option value="">システム標準</option>';
   voices.forEach((v,i)=>{
     const o=document.createElement('option');
     o.value=String(i); o.textContent=v.name+' ('+v.lang+')'; select.appendChild(o);
   });
   if(old) select.value=old;
 }
 loadVoices();
 if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
 $('rate').addEventListener('input',()=> $('rateVal').textContent=Number($('rate').value).toFixed(1));
 function say(value){
   const text=value.trim();
   if(!text){$('output').textContent='先に音声入力してね';return;}
   speechSynthesis.cancel();
   const utterance=new SpeechSynthesisUtterance(text);
   utterance.lang=$('lang').value;
   utterance.rate=Number($('rate').value);
   const selected=$('voice').value;
   if(selected!=='' && voices[Number(selected)]) utterance.voice=voices[Number(selected)];
   $('output').textContent=text;
   speechSynthesis.speak(utterance);
 }
 $('speak').addEventListener('click',()=>say($('text').value));
 $('test').addEventListener('click',()=>say($('lang').value==='ja-JP'?'読み上げテストです':'This is a speech test.'));
 $('stop').addEventListener('click',()=>speechSynthesis.cancel());
 $('clear').addEventListener('click',()=>{$('text').value='';$('output').textContent='---';speechSynthesis.cancel();});
 window.addEventListener('pagehide',()=>speechSynthesis.cancel());
})();
</script>
</body>
</html>
